<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANA - Auth Test</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#0a0a0a;
      color:#e0e0e0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    /* FOND ANIMÉ */
    .bg {
      position:fixed;
      inset:0;
      z-index:0;
    }
    .bg-circle {
      position:absolute;
      border-radius:50%;
      filter:blur(80px);
      opacity:0.15;
      animation:float 8s ease-in-out infinite;
    }
    .bg-circle:nth-child(1) { width:400px; height:400px; background:#00c853; top:-100px; left:-100px; animation-delay:0s; }
    .bg-circle:nth-child(2) { width:300px; height:300px; background:#00897b; bottom:-50px; right:-50px; animation-delay:3s; }
    .bg-circle:nth-child(3) { width:200px; height:200px; background:#1b5e20; top:50%; left:50%; animation-delay:6s; }
    @keyframes float {
      0%,100% { transform:translate(0,0) scale(1); }
      50% { transform:translate(30px,-30px) scale(1.1); }
    }

    /* PARTICULES */
    .particles { position:fixed; inset:0; z-index:0; }
    .particle {
      position:absolute;
      width:2px; height:2px;
      background:#00c853;
      border-radius:50%;
      opacity:0;
      animation:particle 6s ease-in-out infinite;
    }
    @keyframes particle {
      0% { opacity:0; transform:translateY(100vh) scale(0); }
      10% { opacity:0.6; }
      90% { opacity:0.6; }
      100% { opacity:0; transform:translateY(-100px) scale(1); }
    }

    /* CARTE */
    .card {
      position:relative;
      z-index:10;
      width:90%;
      max-width:380px;
      background:rgba(15,15,15,0.8);
      border:1px solid rgba(0,200,83,0.2);
      border-radius:24px;
      padding:40px 32px;
      backdrop-filter:blur(20px);
      box-shadow:0 0 60px rgba(0,200,83,0.1);
      animation:cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(40px) scale(0.95); }
      to { opacity:1; transform:translateY(0) scale(1); }
    }

    /* LOGO */
    .logo-wrap {
      text-align:center;
      margin-bottom:28px;
    }
    .logo-icon {
      font-size:3.5em;
      display:block;
      animation:logoPulse 2s ease-in-out infinite;
      color:#00c853;
      margin-bottom:8px;
    }
    @keyframes logoPulse {
      0%,100% { transform:scale(1) rotate(0deg); filter:drop-shadow(0 0 8px #00c853); }
      50% { transform:scale(1.15) rotate(180deg); filter:drop-shadow(0 0 20px #00c853); }
    }
    .logo-title {
      font-size:1.8em;
      font-weight:200;
      letter-spacing:4px;
      color:#fff;
    }
    .logo-sub {
      font-size:0.8em;
      color:#555;
      margin-top:4px;
      letter-spacing:2px;
    }

    /* TABS */
    .tabs {
      display:flex;
      background:#111;
      border-radius:14px;
      padding:4px;
      margin-bottom:28px;
      border:1px solid #222;
    }
    .tab {
      flex:1;
      padding:10px;
      border:none;
      background:transparent;
      color:#666;
      border-radius:10px;
      cursor:pointer;
      font-size:0.9em;
      font-family:inherit;
      transition:all 0.3s;
      position:relative;
      overflow:hidden;
    }
    .tab.active {
      background:#00c853;
      color:#000;
      font-weight:600;
      box-shadow:0 4px 15px rgba(0,200,83,0.4);
    }
    .tab::before {
      content:'';
      position:absolute;
      inset:0;
      background:rgba(255,255,255,0.1);
      transform:translateX(-100%);
      transition:transform 0.3s;
    }
    .tab:hover::before { transform:translateX(0); }

    /* FORM */
    .form { animation:formIn 0.4s ease; }
    @keyframes formIn {
      from { opacity:0; transform:translateX(20px); }
      to { opacity:1; transform:translateX(0); }
    }

    .input-group {
      position:relative;
      margin-bottom:16px;
    }
    .input-group input {
      width:100%;
      padding:14px 16px 14px 44px;
      background:#111;
      border:1px solid #222;
      border-radius:14px;
      color:#e0e0e0;
      font-size:0.95em;
      outline:none;
      font-family:inherit;
      transition:all 0.3s;
    }
    .input-group input:focus {
      border-color:#00c853;
      box-shadow:0 0 20px rgba(0,200,83,0.15);
      background:#0f0f0f;
    }
    .input-group input::placeholder { color:#444; }
    .input-icon {
      position:absolute;
      left:14px;
      top:50%;
      transform:translateY(-50%);
      font-size:1.1em;
      opacity:0.5;
      transition:opacity 0.3s;
    }
    .input-group input:focus + .input-icon { opacity:1; }

    /* BOUTON */
    .btn {
      width:100%;
      padding:14px;
      background:linear-gradient(135deg,#00c853,#00897b);
      border:none;
      border-radius:14px;
      color:#000;
      font-size:1em;
      font-weight:700;
      cursor:pointer;
      font-family:inherit;
      margin-top:8px;
      position:relative;
      overflow:hidden;
      transition:transform 0.2s, box-shadow 0.2s;
      letter-spacing:1px;
    }
    .btn:hover {
      transform:translateY(-2px);
      box-shadow:0 8px 25px rgba(0,200,83,0.4);
    }
    .btn:active { transform:scale(0.98); }
    .btn::after {
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent);
      opacity:0;
      transition:opacity 0.3s;
    }
    .btn:hover::after { opacity:1; }
    .btn.loading {
      pointer-events:none;
      opacity:0.7;
    }

    /* SEPARATEUR */
    .divider {
      display:flex;
      align-items:center;
      gap:12px;
      margin:20px 0;
      color:#333;
      font-size:0.8em;
    }
    .divider::before, .divider::after {
      content:'';
      flex:1;
      height:1px;
      background:#222;
    }

    /* ERREUR */
    .error {
      background:rgba(255,82,82,0.1);
      border:1px solid rgba(255,82,82,0.3);
      border-radius:10px;
      padding:10px 14px;
      font-size:0.85em;
      color:#ff5252;
      margin-top:12px;
      display:none;
      animation:shake 0.4s ease;
    }
    .error.show { display:block; }
    @keyframes shake {
      0%,100% { transform:translateX(0); }
      25% { transform:translateX(-8px); }
      75% { transform:translateX(8px); }
    }

    /* SUCCÈS */
    .success-overlay {
      position:fixed;
      inset:0;
      background:#0a0a0a;
      z-index:100;
      display:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:16px;
    }
    .success-overlay.show { display:flex; animation:fadeIn 0.5s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .success-icon {
      font-size:5em;
      animation:successPop 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes successPop {
      from { transform:scale(0) rotate(-180deg); }
      to { transform:scale(1) rotate(0deg); }
    }
    .success-text { font-size:1.5em; font-weight:300; color:#00c853; }

    /* FORCE MOT DE PASSE */
    .password-strength {
      height:3px;
      border-radius:2px;
      margin-top:6px;
      transition:all 0.3s;
      background:#222;
      overflow:hidden;
    }
    .password-strength-bar {
      height:100%;
      border-radius:2px;
      transition:all 0.3s;
      width:0%;
    }
  </style>
</head>
<body>

<div class="bg">
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
</div>

<div class="particles" id="particles"></div>

<div class="card">
  <div class="logo-wrap">
    <span class="logo-icon">✦</span>
    <div class="logo-title">PANA</div>
    <div class="logo-sub">INTELLIGENCE ARTIFICIELLE</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="showTab('login')">Connexion</button>
    <button class="tab" id="tab-register" onclick="showTab('register')">Inscription</button>
  </div>

  <!-- LOGIN -->
  <div class="form" id="loginForm">
    <div class="input-group">
      <input type="email" id="loginEmail" placeholder="Adresse email" autocomplete="email"/>
      <span class="input-icon">📧</span>
    </div>
    <div class="input-group">
      <input type="password" id="loginPassword" placeholder="Mot de passe" autocomplete="current-password"/>
      <span class="input-icon">🔒</span>
    </div>
    <button class="btn" id="loginBtn" onclick="login()">SE CONNECTER</button>
  </div>

  <!-- REGISTER -->
  <div class="form" id="registerForm" style="display:none">
    <div class="input-group">
      <input type="text" id="registerName" placeholder="Votre prénom"/>
      <span class="input-icon">👤</span>
    </div>
    <div class="input-group">
      <input type="email" id="registerEmail" placeholder="Adresse email" autocomplete="email"/>
      <span class="input-icon">📧</span>
    </div>
    <div class="input-group">
      <input type="password" id="registerPassword" placeholder="Mot de passe" oninput="checkPassword(this.value)" autocomplete="new-password"/>
      <span class="input-icon">🔒</span>
      <div class="password-strength"><div class="password-strength-bar" id="strengthBar"></div></div>
    </div>
    <button class="btn" id="registerBtn" onclick="register()">CRÉER MON COMPTE</button>
  </div>

  <div class="error" id="authError"></div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-icon">✦</div>
  <div class="success-text" id="successText">Connexion réussie !</div>
</div>

<script>
// Particules
const container = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + 'vw';
  p.style.animationDelay = Math.random() * 6 + 's';
  p.style.animationDuration = (4 + Math.random() * 4) + 's';
  p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
  container.appendChild(p);
}

function showTab(tab) {
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  hideError();
}

function showError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('authError').classList.remove('show');
}

function checkPassword(val) {
  const bar = document.getElementById('strengthBar');
  let strength = 0;
  if (val.length >= 6) strength += 25;
  if (val.length >= 10) strength += 25;
  if (/[A-Z]/.test(val)) strength += 25;
  if (/[0-9!@#$%]/.test(val)) strength += 25;
  bar.style.width = strength + '%';
  bar.style.background = strength < 50 ? '#ff5252' : strength < 75 ? '#ffab40' : '#00c853';
}

function showSuccess(msg) {
  document.getElementById('successText').textContent = msg;
  document.getElementById('successOverlay').classList.add('show');
  setTimeout(() => { window.location.href = 'index.html'; }, 1500);
}

function login() {
  hideError();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { showError('Remplis tous les champs'); return; }
  const btn = document.getElementById('loginBtn');
  btn.textContent = '...';
  btn.classList.add('loading');
  setTimeout(() => {
    const users = JSON.parse(localStorage.getItem('pana_users') || '{}');
    if (!users[email] || users[email].password !== password) {
      showError('Email ou mot de passe incorrect');
      btn.textContent = 'SE CONNECTER';
      btn.classList.remove('loading');
      return;
    }
    localStorage.setItem('pana_user', JSON.stringify(users[email]));
    showSuccess('Bienvenue, ' + users[email].name + ' !');
  }, 800);
}

function register() {
  hideError();
  const name = document.getElementById('registerName').value.trim();
  const email = document.getElementById('registerEmail').value.trim();
  const password = document.getElementById('registerPassword').value;
  if (!name || !email || !password) { showError('Remplis tous les champs'); return; }
  if (password.length < 6) { showError('Mot de passe minimum 6 caractères'); return; }
  const btn = document.getElementById('registerBtn');
  btn.textContent = '...';
  btn.classList.add('loading');
  setTimeout(() => {
    const users = JSON.parse(localStorage.getItem('pana_users') || '{}');
    if (users[email]) { showError('Email déjà utilisé'); btn.textContent = 'CRÉER MON COMPTE'; btn.classList.remove('loading'); return; }
    users[email] = { name, email, password };
    localStorage.setItem('pana_users', JSON.stringify(users));
    localStorage.setItem('pana_user', JSON.stringify({ name, email }));
    showSuccess('Compte créé ! Bienvenue ' + name + ' !');
  }, 800);
}

// Enter pour soumettre
document.addEventListener('keypress', e => {
  if (e.key === 'Enter') {
    const isLogin = document.getElementById('loginForm').style.display !== 'none';
    isLogin ? login() : register();
  }
});
</script>
</body>
</html>
