<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANA AI</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>

  <!-- MODAL NOM -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="logo-big">✦</div>
      <h2>Bienvenue sur PANA</h2>
      <p>Comment dois-je vous appeler ?</p>
      <input type="text" id="nameInput" placeholder="Votre prénom..."/>
      <button onclick="saveName()">Commencer ▶</button>
    </div>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <span>PANA</span>
      <button class="icon-btn" onclick="closeSidebar()">✕</button>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      ✏️ Nouvelle conversation
    </button>
    <div class="history-section">
      <h4>Aujourd'hui</h4>
      <div id="historyList"></div>
    </div>
    <div class="sidebar-bottom">
      <div class="user-info">
        <div class="avatar" id="avatarLetter">?</div>
        <div class="user-name" id="sidebarName">Chargement...</div>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div class="app" id="app" style="display:none">
    <div class="topbar">
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <div class="upgrade-banner">PANA Pro <span class="upgrade-link">Mettre à niveau</span></div>
      <button class="icon-btn" onclick="newChat()">✏️</button>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="star-welcome">✦</div>
        <h1 id="greeting">Bonjour</h1>
      </div>
    </div>

    <div class="input-area">
      <div id="imgsPreviewBox" class="imgs-preview"></div>
      <div class="input-box">
        <textarea id="userInput" placeholder="Discuter avec PANA..."
          rows="1"
          oninput="autoResize(this)"
          onkeydown="handleKey(event)"></textarea>
        <div class="input-footer">
          <div class="left-btns">
            <button class="icon-btn" onclick="document.getElementById('imgInput').click()" style="font-size:1.4em;font-weight:300;">+</button>
            <input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="handleImages(event)"/>
            <span class="model-label">PANA 1.0</span>
          </div>
          <div class="right-btns">
            <button class="send-btn" onclick="sendMessage()">▶</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- PREVIEW CODE -->
  <div class="preview-modal" id="previewModal" style="display:none">
    <div class="preview-header">
      <span>Prévisualisation</span>
      <button onclick="closePreview()">✕</button>
    </div>
    <iframe id="previewFrame" sandbox="allow-scripts"></iframe>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
