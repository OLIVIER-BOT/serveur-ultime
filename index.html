<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANA AI</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <button class="icon-btn">☰</button>
      <div class="upgrade-banner">Accès illimité avec PANA Pro <span class="upgrade-link">Mettre à niveau</span></div>
      <button class="icon-btn">👻</button>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="logo">✳️</div>
        <h1 id="greeting">Bonjour, Moi</h1>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="userInput" placeholder="Discuter avec PANA..." rows="1"
          oninput="autoResize(this)"
          onkeydown="handleKey(event)"></textarea>
        <div class="input-footer">
          <button class="icon-btn">+</button>
          <span class="model-label">PANA 1.0</span>
          <div class="right-btns">
            <button class="icon-btn">🎤</button>
            <button class="send-btn" onclick="sendMessage()">▶</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
