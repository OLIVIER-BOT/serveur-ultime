<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANA AI</title>
  <link rel="stylesheet" href="src/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <!-- AUTH -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <div class="logo-big">✦</div>
      <h2>PANA AI</h2>
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showTab('login')">Connexion</button>
        <button class="auth-tab" onclick="showTab('register')">Inscription</button>
      </div>
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email"/>
        <input type="password" id="loginPassword" placeholder="Mot de passe"/>
        <button onclick="login()">Se connecter</button>
      </div>
      <div id="registerForm" style="display:none">
        <input type="text" id="registerName" placeholder="Prénom"/>
        <input type="email" id="registerEmail" placeholder="Email"/>
        <input type="password" id="registerPassword" placeholder="Mot de passe"/>
        <button onclick="register()">Créer un compte</button>
      </div>
      <p class="auth-error" id="authError"></p>
    </div>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <span>PANA</span>
      <button class="icon-btn" onclick="closeSidebar()">✕</button>
    </div>
    <button class="new-chat-btn" onclick="newChat()">✏️ Nouvelle conversation</button>
    <div class="history-section">
      <h4>Aujourd'hui</h4>
      <div id="historyList"></div>
    </div>
    <div class="sidebar-bottom">
      <div class="user-info">
        <div class="avatar" id="avatarLetter">?</div>
        <div>
          <div class="user-name" id="sidebarName">...</div>
          <div class="user-email" id="sidebarEmail">...</div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">🚪 Déconnexion</button>
    </div>
  </div>

  <!-- APP -->
  <div class="app" id="app" style="display:none">
    <div class="topbar">
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <div class="upgrade-banner">PANA Pro <span class="upgrade-link">Mettre à niveau</span></div>
      <button class="icon-btn" onclick="newChat()">✏️</button>
    </div>
    <div class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="star-welcome">✦</div>
        <h1 id="greeting">Bonjour</h1>
      </div>
    </div>
    <div class="input-area">
      <div id="imgsPreviewBox" class="imgs-preview"></div>
      <div class="input-box">
        <textarea id="userInput" placeholder="Discuter avec PANA..."
          rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
        <div class="input-footer">
          <div class="left-btns">
            <button class="icon-btn" onclick="document.getElementById('imgInput').click()" style="font-size:1.4em;font-weight:300;">+</button>
            <input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="handleImages(event)"/>
            <span class="model-label">PANA 1.0</span>
          </div>
          <div class="right-btns">
            <button class="send-btn" onclick="sendMessage()">▶</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="preview-modal" id="previewModal" style="display:none">
    <div class="preview-header">
      <span>Prévisualisation</span>
      <button onclick="closePreview()">✕</button>
    </div>
    <iframe id="previewFrame" sandbox="allow-scripts"></iframe>
  </div>

  <script src="src/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="src/app.js"></script>
<script>
  window.onerror = function(msg, src, line) {
    document.body.innerHTML += '<p style="color:red;position:fixed;bottom:0;left:0;background:#000;padding:10px;font-size:12px">' + msg + ' (ligne ' + line + ')</p>';
  };
</script>
</body>
</html>
