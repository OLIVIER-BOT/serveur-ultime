<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLIVIER-BOT AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0f0f0f; color: white; }
    header {
      text-align: center; padding: 30px;
      background: linear-gradient(135deg, #0f0f0f, #1a1a2e);
      border-bottom: 1px solid #00ff88;
    }
    header h1 { color: #00ff88; font-size: 2.5em; }
    header p { color: #aaa; margin-top: 10px; }
    .tabs {
      display: flex; justify-content: center;
      gap: 10px; padding: 20px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 20px; border-radius: 20px;
      border: 1px solid #00ff88; background: transparent;
      color: #00ff88; cursor: pointer; font-size: 1em;
    }
    .tab.active { background: #00ff88; color: #0f0f0f; font-weight: bold; }
    .section { display: none; padding: 20px; max-width: 800px; margin: auto; }
    .section.active { display: block; }
    textarea, input {
      width: 100%; padding: 12px; border-radius: 10px;
      background: #1a1a1a; border: 1px solid #333;
      color: white; font-size: 1em; margin-bottom: 10px;
      resize: vertical;
    }
    button.send {
      width: 100%; padding: 12px; border-radius: 10px;
      background: #00ff88; color: #0f0f0f;
      border: none; font-size: 1em; font-weight: bold; cursor: pointer;
    }
    .response {
      margin-top: 20px; padding: 15px; border-radius: 10px;
      background: #1a1a1a; border: 1px solid #00ff88;
      min-height: 60px; white-space: pre-wrap; line-height: 1.6;
    }
    .chat-box {
      height: 350px; overflow-y: auto; padding: 15px;
      background: #1a1a1a; border-radius: 10px;
      border: 1px solid #333; margin-bottom: 10px;
    }
    .msg { margin-bottom: 15px; }
    .msg.user { text-align: right; }
    .msg.user span {
      background: #00ff88; color: #0f0f0f;
      padding: 8px 14px; border-radius: 15px; display: inline-block;
    }
    .msg.bot span {
      background: #1e1e2e; color: white;
      padding: 8px 14px; border-radius: 15px; display: inline-block;
    }
    .loading { color: #00ff88; font-style: italic; }
  </style>
</head>
<body>

<header>
  <h1>🚀 OLIVIER-BOT AI</h1>
  <p>Chatbot • Générateur de texte • Assistant personnel</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="showTab('chat')">💬 Chatbot</button>
  <button class="tab" onclick="showTab('texte')">✍️ Texte</button>
  <button class="tab" onclick="showTab('assistant')">🤖 Assistant</button>
</div>

<!-- CHATBOT -->
<div id="chat" class="section active">
  <div class="chat-box" id="chatBox"></div>
  <input type="text" id="chatInput" placeholder="Écris un message..." />
  <button class="send" onclick="sendChat()">Envoyer</button>
</div>

<!-- GENERATEUR DE TEXTE -->
<div id="texte" class="section">
  <textarea id="texteInput" rows="4" placeholder="Décris ce que tu veux générer... ex: Écris un article sur l'IA"></textarea>
  <button class="send" onclick="genererTexte()">Générer</button>
  <div class="response" id="texteOutput">Le texte généré apparaîtra ici...</div>
</div>

<!-- ASSISTANT PERSONNEL -->
<div id="assistant" class="section">
  <textarea id="assistantInput" rows="4" placeholder="Pose ta question... ex: Comment apprendre Python rapidement ?"></textarea>
  <button class="send" onclick="askAssistant()">Demander</button>
  <div class="response" id="assistantOutput">La réponse apparaîtra ici...</div>
</div>

<script>
  const API = "https://patient-cell-api-serveur.gazoj1209.workers.dev";

  function showTab(name) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(name).classList.add('active');
    event.target.classList.add('active');
  }

  async function callAI(prompt) {
    const res = await fetch(API + "?prompt=" + encodeURIComponent(prompt));
    const data = await res.text();
    return data;
  }

  async function sendChat() {
    const input = document.getElementById('chatInput');
    const box = document.getElementById('chatBox');
    const msg = input.value.trim();
    if (!msg) return;
    box.innerHTML += `<div class="msg user"><span>${msg}</span></div>`;
    box.innerHTML += `<div class="msg bot" id="typing"><span class="loading">En train de répondre...</span></div>`;
    box.scrollTop = box.scrollHeight;
    input.value = '';
    const rep = await callAI(msg);
    document.getElementById('typing').innerHTML = `<span>${rep}</span>`;
    box.scrollTop = box.scrollHeight;
  }

  async function genererTexte() {
    const input = document.getElementById('texteInput').value.trim();
    const output = document.getElementById('texteOutput');
    if (!input) return;
    output.innerHTML = '<span class="loading">Génération en cours...</span>';
    output.textContent = await callAI(input);
  }

  async function askAssistant() {
    const input = document.getElementById('assistantInput').value.trim();
    const output = document.getElementById('assistantOutput');
    if (!input) return;
    output.innerHTML = '<span class="loading">Recherche en cours...</span>';
    output.textContent = await callAI(input);
  }

  document.getElementById('chatInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendChat();
  });
</script>
</body>
</html>
