<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANA AI</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <button class="icon-btn" onclick="newChat()">✏️</button>
    </div>
    <div class="history" id="history"></div>
  </div>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <span class="model-badge">PANA 1.0</span>
      <button class="icon-btn ghost">👻</button>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="welcome">
        <div class="logo">✳️</div>
        <h1>Bonsoir, <span id="username">Moi</span></h1>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <button class="icon-btn">+</button>
        <textarea id="userInput" placeholder="Discuter avec PANA..." rows="1"
          oninput="autoResize(this)"
          onkeydown="handleKey(event)"></textarea>
        <button class="icon-btn">🎤</button>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
            <path d="M12 4l8 8-8 8V4z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
