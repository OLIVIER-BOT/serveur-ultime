<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLIVIER-BOT AI</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header>
    <h1>🚀 OLIVIER-BOT AI</h1>
    <p>Chatbot • Générateur • Assistant</p>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showTab('chat', this)">💬 Chat</button>
    <button class="tab" onclick="showTab('texte', this)">✍️ Texte</button>
    <button class="tab" onclick="showTab('assistant', this)">🤖 Assistant</button>
  </div>

  <div id="chat" class="section active">
    <div class="chat-box" id="chatBox"></div>
    <div class="input-row">
      <input type="text" id="chatInput" placeholder="Écris un message..." />
      <button onclick="sendChat()">➤</button>
    </div>
  </div>

  <div id="texte" class="section">
    <textarea id="texteInput" rows="4" placeholder="Décris ce que tu veux générer..."></textarea>
    <button class="send" onclick="genererTexte()">Générer</button>
    <div class="response" id="texteOutput">Le résultat apparaîtra ici...</div>
  </div>

  <div id="assistant" class="section">
    <textarea id="assistantInput" rows="4" placeholder="Pose ta question..."></textarea>
    <button class="send" onclick="askAssistant()">Demander</button>
    <div class="response" id="assistantOutput">La réponse apparaîtra ici...</div>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
